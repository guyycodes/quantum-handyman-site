[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables can be set here (but it's better to use Netlify dashboard)
# [build.environment]
#   VITE_EMAILJS_SERVICE_ID = "your_service_id"
#   VITE_EMAILJS_TEMPLATE_ID = "your_template_id"
#   VITE_EMAILJS_PUBLIC_KEY = "your_public_key"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173

# Note: Security headers are defined in public/_headers for better management
# The _headers file provides more granular control over CSP and caching

# SEO Headers
[[headers]]
  for = "/"
  [headers.values]
    Link = '''
    </manifest.json>; rel="manifest", 
    </logo.svg>; rel="icon", 
    <https://fonts.googleapis.com>; rel="preconnect", 
    <https://fonts.gstatic.com>; rel="preconnect" crossorigin
    '''

# Cache Control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Control for images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

# Cache Control for fonts
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO files
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json; charset=utf-8"