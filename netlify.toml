[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  function = "ai-estimate"
  path = "/api/ai-estimate"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/technician/*"
  to = "/technician/index.html"
  status = 200

[[redirects]]
  from = "/web/*"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {path = "!/api/*"}

# Environment variables can be set here (but it's better to use Netlify dashboard)
# [build.environment]
#   VITE_EMAILJS_SERVICE_ID = "your_service_id"
#   VITE_EMAILJS_TEMPLATE_ID = "your_template_id"
#   VITE_EMAILJS_PUBLIC_KEY = "your_public_key"

[dev]
  port = 8888
  targetPort = 5173

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://quantumhandyman.com https://www.googletagmanager.com https://www.google-analytics.com https://js.stripe.com https://us.i.posthog.com https://us-assets.i.posthog.com https://app.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.emailjs.com https://vitals.vercel-insights.com https://script.google.com https://*.googleusercontent.com https://api.openai.com https://api.stripe.com https://us.i.posthog.com https://us-assets.i.posthog.com https://app.posthog.com wss://us.i.posthog.com https://www.google-analytics.com https://stats.g.doubleclick.net https://www.googletagmanager.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com; media-src 'self' blob: data:; base-uri 'self'; form-action 'self'"

# SEO Headers
[[headers]]
  for = "/"
  [headers.values]
    Link = '''
    </manifest.json>; rel="manifest", 
    </logo.svg>; rel="icon", 
    <https://fonts.googleapis.com>; rel="preconnect", 
    <https://fonts.gstatic.com>; rel="preconnect" crossorigin
    '''

# Cache Control for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Control for images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

# Cache Control for fonts
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO files
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json; charset=utf-8"